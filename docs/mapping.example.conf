# Sample mapping file for JLCooperPanelDaemon - copy to
#   ~/Library/Application Support/JLCooperPanelDaemon/mapping.conf
# See docs/MAPPING.md. The file is re-read automatically within a second of saving.

# --- 1. SHIFT layer on the Offset page (mode key 2): Temp, Tint, Highlights, Shadows -------
# Ids found on one setup (Eclipse, Resolve Studio 21.2); see "Control ids found by scanning"
# in docs/MAPPING.md. Hold SHIFT and turn knobs 1-4 of mode key 2; without SHIFT the stock
# Red/Green/Blue/Master Offset stay. Shadows (2/25) is inferred, the other three are confirmed.
# Works only while a colour palette is open (Color Wheels, Curves, Color Slice, Color Warper). With
# Qualifier open they move a luminance parameter, with Sizing open they distort the picture, with
# Window/Tracker/Magic Mask/Blur/Key open they do nothing.
shiftpot   2 1 2/8      # Color Temp  (+ = warmer)
shiftpot   2 2 2/9      # Tint        (+ = towards magenta)
shiftpot   2 3 2/24     # Highlights
shiftpot   2 4 2/25     # Shadows
shiftlabel 2 1 Color|Temp
shiftlabel 2 2 Color|Tint
shiftlabel 2 3 Hilights|
shiftlabel 2 4 Shadows|

# --- 2. SHIFT layers for the Hue curves: Hue vs Hue / Hue vs Sat / Hue vs Lum --------------
# Hold SHIFT and turn knobs 1-6 of mode key 3, 4 or 5 (pages 4, 5, 6; file page index 3, 4, 5) to
# move the Red, Yellow, Green, Cyan, Blue and Magenta point of the curve. Page 3 (section 1) keeps
# Temp/Tint/Highlights/Shadows. Ids found on one setup (Eclipse, Resolve Studio 21.2), see
# "Hue curves" in docs/MAPPING.md. Limits:
#  - Only while a Hue-family curve is open in the Curves palette. Under Custom they do nothing.
#  - Turning a knob also selects that curve type (Hue vs Hue, Sat or Lum) in Resolve.
#  - No panel key selects a Curves sub-mode, so open the curve you want with the mouse first.
#  - Other palettes were not checked. These ids are palette dependent, like section 1.
# Page 4 - Hue vs Hue
shiftpot   3 1 2/0      # Red
shiftpot   3 2 2/1      # Yellow
shiftpot   3 3 2/2      # Green
shiftpot   3 4 2/3      # Cyan
shiftpot   3 5 2/4      # Blue
shiftpot   3 6 2/5      # Magenta
shiftlabel 3 1 Red|HvH
shiftlabel 3 2 Yellow|HvH
shiftlabel 3 3 Green|HvH
shiftlabel 3 4 Cyan|HvH
shiftlabel 3 5 Blue|HvH
shiftlabel 3 6 Magenta|HvH
# Page 5 - Hue vs Sat
shiftpot   4 1 2/16     # Red
shiftpot   4 2 2/17     # Yellow
shiftpot   4 3 2/18     # Green
shiftpot   4 4 2/19     # Cyan
shiftpot   4 5 2/20     # Blue
shiftpot   4 6 2/21     # Magenta
shiftlabel 4 1 Red|HvS
shiftlabel 4 2 Yellow|HvS
shiftlabel 4 3 Green|HvS
shiftlabel 4 4 Cyan|HvS
shiftlabel 4 5 Blue|HvS
shiftlabel 4 6 Magenta|HvS
# Page 6 - Hue vs Lum
shiftpot   5 1 2/6      # Red
shiftpot   5 2 2/7      # Yellow
shiftpot   5 3 2/8      # Green
shiftpot   5 4 2/9      # Cyan
shiftpot   5 5 2/10     # Blue
shiftpot   5 6 2/11     # Magenta
shiftlabel 5 1 Red|HvL
shiftlabel 5 2 Yellow|HvL
shiftlabel 5 3 Green|HvL
shiftlabel 5 4 Cyan|HvL
shiftlabel 5 5 Blue|HvL
shiftlabel 5 6 Magenta|HvL

# --- 3. Trackball lights -------------------------------------------------------------------
# Lights the three trackballs (left, centre, right): off, green, blue or red each. Removing the line
# switches them off. See docs/TIMECODE.md (which also shows how to get the timecode on the display).
# ballcolors red green blue     # the colours of the Eclipse CX product photos

# Key backlight for a dark room: 'on' lights every key except the 8 mode keys (which show the active mode),
# 'all' lights those too, 'off' (default) is the stock behaviour.
# keylights on

# --- 4. Find out which id does what (only while you are looking for ids) -------------------
# Probe mode: knob 6 chooses the id (SHIFT = +-16), knob 5 drives it, knob 5 push resets it,
# the 7-segment display shows "<panel>   <control>". Use a throwaway clip!
# probe on
# probestart 2/33          # 2/33 should move Saturation (calibration)
